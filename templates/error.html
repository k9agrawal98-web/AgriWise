{% extends 'base.html' %}
{% block title %}{{ t('error.title') }} — AgriWise AI{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-0 rounded-4 p-5 text-center">
      <div class="mb-3"><i class="fa-solid fa-triangle-exclamation fa-3x text-warning"></i></div>
      <h2 class="page-title">{{ t('error.title') }}</h2>
      <p class="text-muted">{{ message }}</p>
      <a href="{{ url_for('index') }}" class="btn btn-success">{{ t('error.home') }}</a>
    </div>
  </div>
</div>
{% endblock %}
