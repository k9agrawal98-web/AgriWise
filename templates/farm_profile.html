{% extends 'base.html' %}
{% block title %}{{ t('farm_profile.title') }} — AgriWise AI{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm border-0 rounded-4 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0">{{ t('farm_profile.title') }}</h2>
        <button class="btn btn-outline-success" type="button" id="detect-location-btn">{{ t('farm_profile.detect_location') }}</button>
      </div>
      <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">{{ t('farm_profile.farm_name') }}</label>
            <input type="text" name="farm_name" class="form-control" value="{{ farm.farm_name if farm else '' }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ t('farm_profile.location_name') }}</label>
            <input type="text" name="location_name" class="form-control" value="{{ farm.location_name if farm else '' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ t('farm_profile.area_acres') }}</label>
            <input type="number" step="0.01" name="area" class="form-control" value="{{ farm.area if farm else '' }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ t('farm_profile.soil_type') }}</label>
            <input type="text" name="soil_type" class="form-control" value="{{ farm.soil_type if farm else '' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ t('farm_profile.water_source') }}</label>
            <input type="text" name="water_source" class="form-control" value="{{ farm.water_source if farm else '' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ t('farm_profile.latitude') }}</label>
            <input type="number" step="any" min="-90" max="90" name="latitude" id="latitude-field" class="form-control" value="{{ farm.latitude if farm else '' }}">
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ t('farm_profile.longitude') }}</label>
            <input type="number" step="any" min="-180" max="180" name="longitude" id="longitude-field" class="form-control" value="{{ farm.longitude if farm else '' }}">
          </div>
        </div>
        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-success">{{ t('farm_profile.save') }}</button>
          <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">{{ t('farm_profile.back_dashboard') }}</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/location.js') }}"></script>
{% endblock %}
