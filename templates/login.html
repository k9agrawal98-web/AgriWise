{% extends 'base.html' %}
{% block title %}AgriWise AI | Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-0 rounded-4 p-4 mt-5">
      <h2 class="mb-4 text-center">{{ t('auth.login') }}</h2>
      <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
          <label class="form-label">{{ t('auth.email') }}</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">{{ t('auth.password') }}</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">{{ t('auth.login') }}</button>
      </form>
      <p class="mt-3 text-center mb-0">{{ t('auth.need_account') }} <a href="{{ url_for('register') }}">{{ t('auth.register_here') }}</a></p>
    </div>
  </div>
</div>
{% endblock %}
